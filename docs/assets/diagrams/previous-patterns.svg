<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9e2ec"/></marker><marker id="arrow-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f7fa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-claim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="arrow-claim_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1fd"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="arrow-ok_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6f6ed"/></marker><marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="arrow-deny_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdecec"/></marker><marker id="arrow-mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arrow-mask_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf4e3"/></marker><marker id="arrow-genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5bd6"/></marker><marker id="arrow-genie_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1edfb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Per-user answers before custom identity claims: every pattern had a cost</text><rect x="40" y="76" width="220" height="250" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="54" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Provision every user</text><text x="54" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="bold" text-anchor="start">HOW</text><text x="54" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">SCIM or token federation makes</text><text x="54" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">each end user a Databricks</text><text x="54" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">identity</text><text x="54" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#d64545" font-weight="bold" text-anchor="start">COST</text><text x="54" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Sync every external user</text><text x="54" y="263.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Federation needs users that</text><text x="54" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">already exist</text><text x="54" y="298.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Account identity limits</text><rect x="276" y="76" width="220" height="250" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="290" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">One SP per tenant</text><text x="290" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="bold" text-anchor="start">HOW</text><text x="290" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">Views filter on session_user()</text><text x="290" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">with one service principal</text><text x="290" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">per customer</text><text x="290" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#d64545" font-weight="bold" text-anchor="start">COST</text><text x="290" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Access only per tenant</text><text x="290" y="263.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">A secret per tenant</text><text x="290" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Identities multiply by role</text><rect x="512" y="76" width="220" height="250" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="526" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Embedded dashboards</text><text x="526" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="bold" text-anchor="start">HOW</text><text x="526" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">Signed per-viewer filters</text><text x="526" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">on published dashboards</text><text x="526" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#d64545" font-weight="bold" text-anchor="start">COST</text><text x="526" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">No free-form questions</text><rect x="748" y="76" width="220" height="250" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="762" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Tool-only agents</text><text x="762" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="bold" text-anchor="start">HOW</text><text x="762" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">An agent calls UC function</text><text x="762" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">tools with a server-bound id</text><text x="762" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#d64545" font-weight="bold" text-anchor="start">COST</text><text x="762" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Only the questions the</text><text x="762" y="263.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">tools were built for</text><rect x="984" y="76" width="220" height="250" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="998" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">User id in the prompt</text><text x="998" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="bold" text-anchor="start">HOW</text><text x="998" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">The id travels as text or</text><text x="998" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="start">as a session variable</text><text x="998" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#d64545" font-weight="bold" text-anchor="start">COST</text><text x="998" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">Not secure: users, injected</text><text x="998" y="263.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">text or the model itself</text><text x="998" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#d64545" font-weight="normal" text-anchor="start">can change it</text><rect x="40" y="350" width="1160" height="120" rx="10" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.5"/><text x="64" y="384" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f6fde" font-weight="bold" text-anchor="start">With custom identity claims</text><text x="64" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">One service principal per application. A signed token names the end user on every request.</text><text x="64" y="433.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Entitlements are rows in a table. Unity Catalog filters every query. Genie stays free-form.</text></svg>