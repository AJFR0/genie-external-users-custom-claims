font-weight="normal" text-anchor="middle">03 entitlements</text><rect x="411.36" y="64" width="117.92000000000002" height="25" rx="12.5" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.2"/><text x="470.32000000000005" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fde" font-weight="normal" text-anchor="middle">04 claim views</text><rect x="547.28" y="64" width="139.76" height="25" rx="12.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="617.16" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle">05 runtime grants</text><rect x="705.04" y="64" width="117.92000000000002" height="25" rx="12.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="764.0" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle">06 Genie Agent</text><rect x="840.96" y="64" width="96.08000000000001" height="25" rx="12.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="889.0" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle">07 validate</text><rect x="40" y="130" width="1160" height="130" rx="10" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="54" y="156" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Step 04 when the function returns NULL without a claim</text><rect x="70" y="176" width="330" height="64" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="84" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Admin creates the views</text><rect x="450" y="176" width="330" height="64" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="464" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Ownership set to view_owner</text><polyline points="400,208 446,208" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><rect x="40" y="290" width="1160" height="200" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/><text x="54" y="316" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Step 04 when the function raises OAUTH_CUSTOM_IDENTITY_CLAIM_NOT_PROVIDED</text><rect x="70" y="350" width="260" height="90" rx="10" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/><circle cx="92" cy="372" r="13" fill="#b7791f"/><text x="92" y="376.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="114" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Temporary grants to the</text><text x="114" y="395.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">portal SP</text><polyline points="330,395 351,395" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><rect x="355" y="350" width="260" height="90" rx="10" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/><circle cx="377" cy="372" r="13" fill="#b7791f"/><text x="377" y="376.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="399" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Portal SP creates views</text><text x="399" y="395.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">with a claim-carrying</text><text x="399" y="413.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">token</text><polyline points="615,395 636,395" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><rect x="640" y="350" width="260" height="90" rx="10" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/><circle cx="662" cy="372" r="13" fill="#b7791f"/><text x="662" y="376.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="684" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Admin takes ownership</text><polyline points="900,395 921,395" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><rect x="925" y="350" width="260" height="90" rx="10" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/><circle cx="947" cy="372" r="13" fill="#b7791f"/><text x="947" y="376.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="969" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Temporary grants revoked,</text><text x="969" y="395.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">even on failure</text><text x="40" y="530" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">Either way the portal service principal ends with SELECT on portal views and nothing else.</text></svg>