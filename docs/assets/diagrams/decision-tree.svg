<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9e2ec"/></marker><marker id="arrow-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f7fa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-claim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="arrow-claim_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1fd"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="arrow-ok_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6f6ed"/></marker><marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="arrow-deny_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdecec"/></marker><marker id="arrow-mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arrow-mask_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf4e3"/></marker><marker id="arrow-genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5bd6"/></marker><marker id="arrow-genie_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1edfb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Is this the right pattern?</text><rect x="40" y="70" width="330" height="76" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="54" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Do users ask free-form questions?</text><rect x="40" y="210" width="330" height="96" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/><text x="54" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b7791f" font-weight="bold" text-anchor="start">Use something simpler</text><text x="54" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">Embedded dashboards, or an agent</text><text x="54" y="275.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">with UC function tools</text><polyline points="205,146 205,206" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><text x="222" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b7791f" font-weight="normal" text-anchor="middle">no</text><rect x="450" y="70" width="330" height="76" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="464" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Are the users employees already</text><text x="464" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">synced to Databricks?</text><polyline points="370,108 446,108" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="408" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">yes</text><rect x="450" y="210" width="330" height="96" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/><text x="464" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b7791f" font-weight="bold" text-anchor="start">Per-user identities</text><text x="464" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">Standard identities with row filters</text><polyline points="615,146 615,206" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><text x="634" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b7791f" font-weight="normal" text-anchor="middle">yes</text><rect x="860" y="70" width="330" height="76" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="874" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Does a multi-agent supervisor</text><text x="874" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">sit in front of Genie?</text><polyline points="780,108 856,108" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="818" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">no</text><rect x="860" y="210" width="330" height="96" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/><text x="874" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b7791f" font-weight="bold" text-anchor="start">Bind the id in tools</text><text x="874" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">Pass the user id server-side</text><text x="874" y="275.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">to UC function tools</text><polyline points="1025,146 1025,206" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><text x="1044" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b7791f" font-weight="normal" text-anchor="middle">yes</text><rect x="860" y="350" width="330" height="76" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="874" y="376" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Must per-user attribution live in</text><text x="874" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">Databricks audit tables?</text><polyline points="1200,108 1220,108 1220,388 1194,388" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="1232" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">no</text><rect x="450" y="350" width="330" height="96" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/><text x="464" y="376" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b7791f" font-weight="bold" text-anchor="start">Plan the audit trail</text><text x="464" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">Queries are attributed to the</text><text x="464" y="415.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">service principal: log users in your app</text><polyline points="856,388 784,388" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow-mask)"/><text x="820" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b7791f" font-weight="normal" text-anchor="middle">yes</text><rect x="860" y="500" width="330" height="96" rx="10" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="874" y="526" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f9d55" font-weight="bold" text-anchor="start">Custom identity claims</text><text x="874" y="548.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">One service principal per application,</text><text x="874" y="565.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">one Genie Agent: this repo</text><polyline points="1025,426 1025,496" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="1044" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">no</text></svg>