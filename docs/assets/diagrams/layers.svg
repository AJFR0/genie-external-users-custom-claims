<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" role="img"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9e2ec"/></marker><marker id="arrow-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f7fa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-claim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="arrow-claim_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1fd"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="arrow-ok_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6f6ed"/></marker><marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="arrow-deny_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdecec"/></marker><marker id="arrow-mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arrow-mask_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf4e3"/></marker><marker id="arrow-genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5bd6"/></marker><marker id="arrow-genie_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1edfb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Five layers, each proved by the isolation suite</text><rect x="40" y="66" width="740" height="106" rx="10" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.5"/><text x="62" y="100" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f6fde" font-weight="bold" text-anchor="start">1  Reach: Unity Catalog grants</text><text x="62" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">The application's group reads its portal views and nothing else</text><rect x="62" y="142" width="213.12" height="23" rx="11.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="168.56" y="156" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="normal" text-anchor="middle">proved by: privilege · cross_app</text><rect x="860" y="77" width="340" height="84" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="874" y="103" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="start">Another application's service principal</text><text x="874" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">stops at layer 1: PERMISSION_DENIED</text><polyline points="856,119 784,119" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-deny)"/><rect x="40" y="192" width="740" height="106" rx="10" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.5"/><text x="62" y="226" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f6fde" font-weight="bold" text-anchor="start">2  Row policies (ABAC)</text><text x="62" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">Each base table admits only this user's rows, before the query's own conditions run</text><rect x="62" y="268" width="213.12" height="23" rx="11.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="168.56" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="normal" text-anchor="middle">proved by: side_channel · drills</text><rect x="860" y="203" width="340" height="84" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="874" y="229" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="start">An error probe for another user's value</text><text x="874" y="251.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">stops at layer 2: blocked</text><polyline points="856,245 784,245" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-deny)"/><rect x="40" y="318" width="740" height="106" rx="10" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.5"/><text x="62" y="352" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f6fde" font-weight="bold" text-anchor="start">3  Service principal binding</text><text x="62" y="380" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">session_user() = this application's service principal, in every view</text><rect x="62" y="394" width="126.88000000000001" height="23" rx="11.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="125.44" y="408" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="normal" text-anchor="middle">proved by: binding</text><rect x="860" y="329" width="340" height="84" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="874" y="355" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="start">A mistaken grant to another application</text><text x="874" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">stops at layer 3: 0 rows</text><polyline points="856,371 784,371" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-deny)"/><rect x="40" y="444" width="740" height="106" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text x="62" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f6fde" font-weight="bold" text-anchor="start">4  Claim → entitlements</text><text x="62" y="506" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">Grant rows for the user named in the signed token</text><rect x="62" y="520" width="200.8" height="23" rx="11.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="162.4" y="534" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="normal" text-anchor="middle">proved by: visibility · attack</text><rect x="860" y="455" width="340" height="84" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="874" y="481" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="start">A forged, unknown or malformed claim</text><text x="874" y="503.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">stops at layer 4: 0 rows</text><polyline points="856,497 784,497" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-deny)"/><rect x="40" y="570" width="740" height="106" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text x="62" y="604" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f6fde" font-weight="bold" text-anchor="start">5  Role policy</text><text x="62" y="632" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">What that role may see: detail level, masking, minimum group size</text><rect x="62" y="646" width="151.52" height="23" rx="11.5" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/><text x="137.76" y="660" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" font-weight="normal" text-anchor="middle">proved by: role_effect</text><rect x="860" y="581" width="340" height="84" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="874" y="607" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="start">An advisor asks for dates of birth</text><text x="874" y="629.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">stops at layer 5: masked</text><polyline points="856,623 784,623" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#arrow-deny)"/></svg>