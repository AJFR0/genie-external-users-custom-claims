<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9e2ec"/></marker><marker id="arrow-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f7fa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-claim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="arrow-claim_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1fd"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="arrow-ok_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6f6ed"/></marker><marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="arrow-deny_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdecec"/></marker><marker id="arrow-mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arrow-mask_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf4e3"/></marker><marker id="arrow-genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5bd6"/></marker><marker id="arrow-genie_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1edfb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">One mistake at a time: what reaches a portal user</text><text x="40" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">Single-layer cells were measured on synthetic data; the layered column is the misconfiguration drills.</text><rect x="430" y="88" width="250" height="44" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="555" y="116" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Views only</text><rect x="700" y="88" width="250" height="44" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="825" y="116" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">ABAC only</text><rect x="970" y="88" width="250" height="44" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="1095" y="116" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Layered</text><text x="40" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" font-weight="bold" text-anchor="start">Error probe in a user's query</text><text x="40" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">for a value in another user's rows</text><rect x="430" y="156" width="250" height="76" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="555" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d64545" font-weight="bold" text-anchor="middle">Leaks: one fact per question</text><rect x="700" y="156" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="825" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Blocked</text><rect x="970" y="156" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="1095" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Blocked</text><text x="40" y="284" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" font-weight="bold" text-anchor="start">New table, protection forgotten</text><text x="40" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">granted, but no view or no tags</text><rect x="430" y="254" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="555" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Invisible: no grant</text><rect x="700" y="254" width="250" height="76" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="825" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d64545" font-weight="bold" text-anchor="middle">Whole table</text><rect x="970" y="254" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="1095" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">0 rows: default-deny</text><text x="40" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" font-weight="bold" text-anchor="start">View without its filter</text><text x="40" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">a new view, granted to the portal</text><rect x="430" y="352" width="250" height="76" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="555" y="396" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d64545" font-weight="bold" text-anchor="middle">Whole table</text><rect x="700" y="352" width="250" height="76" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="825" y="396" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">No views in this design</text><rect x="970" y="352" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="1095" y="396" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Own rows: the policy filters</text><text x="40" y="480" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" font-weight="bold" text-anchor="start">Tag removed from a key column</text><text x="40" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">the policy no longer matches</text><rect x="430" y="450" width="250" height="76" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="555" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">No tags in this design</text><rect x="700" y="450" width="250" height="76" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="825" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d64545" font-weight="bold" text-anchor="middle">Whole table</text><rect x="970" y="450" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="1095" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Own rows: the view filters</text><text x="40" y="578" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" font-weight="bold" text-anchor="start">Policy names another group</text><text x="40" y="602" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">for example after a rotation</text><rect x="430" y="548" width="250" height="76" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="555" y="592" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">No policies in this design</text><rect x="700" y="548" width="250" height="76" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="825" y="592" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d64545" font-weight="bold" text-anchor="middle">Whole table</text><rect x="970" y="548" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="1095" y="592" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Own rows: the view filters</text><text x="40" y="676" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" font-weight="bold" text-anchor="start">Base table granted to the portal</text><text x="40" y="700" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">a direct grant by mistake</text><rect x="430" y="646" width="250" height="76" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="555" y="690" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d64545" font-weight="bold" text-anchor="middle">Whole table</text><rect x="700" y="646" width="250" height="76" rx="8" fill="#f5f7fa" stroke="#d9e2ec" stroke-width="1.5"/><text x="825" y="690" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Normal state here</text><rect x="970" y="646" width="250" height="76" rx="8" fill="#e6f6ed" stroke="#1f9d55" stroke-width="1.5"/><text x="1095" y="690" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f9d55" font-weight="bold" text-anchor="middle">Own rows: the policy filters</text></svg>