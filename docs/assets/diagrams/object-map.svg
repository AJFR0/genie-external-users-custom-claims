<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9e2ec"/></marker><marker id="arrow-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f7fa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-claim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="arrow-claim_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1fd"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="arrow-ok_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6f6ed"/></marker><marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="arrow-deny_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdecec"/></marker><marker id="arrow-mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arrow-mask_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf4e3"/></marker><marker id="arrow-genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5bd6"/></marker><marker id="arrow-genie_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1edfb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Who owns what, and who can read what</text><rect x="40" y="70" width="340" height="80" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="54" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Pipelines and internal users</text><text x="54" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">write and read base tables as usual</text><rect x="450" y="70" width="340" height="80" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="464" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">View owner</text><text x="464" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">you, or an account group in production</text><rect x="860" y="70" width="340" height="80" rx="10" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.5"/><text x="874" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f6fde" font-weight="bold" text-anchor="start">Portal service principal</text><text x="874" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">one per application</text><rect x="40" y="250" width="340" height="150" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="54" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">&lt;example&gt;_base</text><text x="54" y="298.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">plans, participants, balances</text><text x="54" y="315.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">no claim logic: pipelines unaffected</text><rect x="450" y="250" width="340" height="150" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="464" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">&lt;example&gt;_governance</text><text x="464" y="298.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">portal_user_grants</text><text x="464" y="315.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">role_policies</text><text x="464" y="333.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">my_effective_grants (claim)</text><rect x="860" y="250" width="340" height="150" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="874" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">&lt;example&gt;_portal</text><text x="874" y="298.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">claim-keyed views</text><text x="874" y="315.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">my_access</text><text x="874" y="333.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">public reference views</text><polyline points="210,150 210,246" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="236" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">write</text><polyline points="560,150 300,246" fill="none" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow-line)"/><polyline points="620,150 620,246" fill="none" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow-line)"/><text x="560" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">owner's rights</text><polyline points="1030,150 1030,246" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="1110" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">SELECT on views only</text><polyline points="860,135 825,135 825,430 210,430 210,404" fill="none" stroke="#d64545" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-deny)"/><polyline points="620,430 620,404" fill="none" stroke="#d64545" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-deny)"/><text x="415" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d64545" font-weight="normal" text-anchor="middle">no grants on base or governance</text><rect x="860" y="480" width="340" height="110" rx="10" fill="#f1edfb" stroke="#7b5bd6" stroke-width="1.5"/><text x="874" y="506" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7b5bd6" font-weight="bold" text-anchor="start">Genie Agent</text><text x="874" y="528.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">attached to portal views only</text><text x="874" y="545.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">prompt matching off on claim-keyed views</text><text x="874" y="563.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" font-weight="normal" text-anchor="start">portal SP has Can Run</text><polyline points="1030,476 1030,404" fill="none" stroke="#7b5bd6" stroke-width="2" marker-end="url(#arrow-genie)"/></svg>