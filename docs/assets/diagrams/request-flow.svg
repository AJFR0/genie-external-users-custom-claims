<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9e2ec"/></marker><marker id="arrow-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f7fa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="arrow-claim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="arrow-claim_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1fd"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="arrow-ok_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6f6ed"/></marker><marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="arrow-deny_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdecec"/></marker><marker id="arrow-mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arrow-mask_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf4e3"/></marker><marker id="arrow-genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5bd6"/></marker><marker id="arrow-genie_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1edfb"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">How one question flows</text><rect x="30" y="60" width="200" height="46" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="130.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">User's browser</text><polyline points="130,106 130,580" fill="none" stroke="#d9e2ec" stroke-width="2" stroke-dasharray="4 6"/><rect x="290" y="60" width="200" height="46" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="390.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Your backend</text><polyline points="390,106 390,580" fill="none" stroke="#d9e2ec" stroke-width="2" stroke-dasharray="4 6"/><rect x="550" y="60" width="200" height="46" rx="10" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/><text x="650.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Databricks OAuth</text><polyline points="650,106 650,580" fill="none" stroke="#d9e2ec" stroke-width="2" stroke-dasharray="4 6"/><rect x="780" y="60" width="200" height="46" rx="10" fill="#f1edfb" stroke="#d9e2ec" stroke-width="1.5"/><text x="880.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Genie Agent</text><polyline points="880,106 880,580" fill="none" stroke="#d9e2ec" stroke-width="2" stroke-dasharray="4 6"/><rect x="1010" y="60" width="200" height="46" rx="10" fill="#eaf1fd" stroke="#d9e2ec" stroke-width="1.5"/><text x="1110.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Unity Catalog</text><polyline points="1110,106 1110,580" fill="none" stroke="#d9e2ec" stroke-width="2" stroke-dasharray="4 6"/><polyline points="130,160 386,160" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="258" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" font-weight="normal" text-anchor="middle">sign in with your identity provider</text><circle cx="106" cy="160" r="13" fill="#1f2933"/><text x="106" y="164.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="400" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start">user id comes from the server-side session</text><polyline points="390,230 646,230" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#arrow-claim)"/><text x="518" y="220" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6fde" font-weight="normal" text-anchor="middle">client_credentials + custom_claim=pu-2001</text><circle cx="366" cy="230" r="13" fill="#2f6fde"/><text x="366" y="234.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><polyline points="650,266 394,266" fill="none" stroke="#2f6fde" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-claim)"/><text x="522" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6fde" font-weight="normal" text-anchor="middle">signed token: custom.claim = pu-2001</text><polyline points="390,340 876,340" fill="none" stroke="#7b5bd6" stroke-width="2" marker-end="url(#arrow-genie)"/><text x="640" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7b5bd6" font-weight="normal" text-anchor="middle">question + that token</text><circle cx="366" cy="340" r="13" fill="#7b5bd6"/><text x="366" y="344.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><polyline points="880,400 1106,400" fill="none" stroke="#7b5bd6" stroke-width="2" marker-end="url(#arrow-genie)"/><text x="995" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7b5bd6" font-weight="normal" text-anchor="middle">SQL, the same for every user</text><circle cx="856" cy="400" r="13" fill="#7b5bd6"/><text x="856" y="404.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><rect x="990" y="456" width="240" height="70" rx="10" fill="#eaf1fd" stroke="#2f6fde" stroke-width="1.5"/><circle cx="966" cy="491" r="13" fill="#2f6fde"/><text x="966" y="495.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="1004" y="482.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6fde" font-weight="normal" text-anchor="start">claim → entitlements table</text><text x="1004" y="499.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6fde" font-weight="normal" text-anchor="start">→ only the permitted rows</text><polyline points="1110,560 134,560" fill="none" stroke="#1f9d55" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/><text x="620" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f9d55" font-weight="normal" text-anchor="middle">answer, through Genie and your backend</text><text x="40" y="606" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">The browser never sees the token, the claim or the Genie conversation id.</text></svg>