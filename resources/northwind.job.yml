resources:
  jobs:
    northwind_deploy:
      name: genie-claims-ref · Northwind deploy
      max_concurrent_runs: 1
      parameters:
        - {name: example, default: northwind}
        - {name: catalog, default: "${var.catalog}"}
        - {name: create_catalog, default: "${var.create_catalog}"}
        - {name: warehouse_id, default: "${var.warehouse_id}"}
        - {name: secret_scope, default: "${var.secret_scope}"}
        - {name: view_owner, default: "${var.view_owner}"}
        - {name: include_genie, default: "true"}
      tasks:
        - task_key: check_availability
          notebook_task:
            notebook_path: ../notebooks/01_check_availability.py
        - task_key: create_data
          depends_on: [{task_key: check_availability}]
          notebook_task:
            notebook_path: ../notebooks/02_create_data.py
        - task_key: entitlements
          depends_on: [{task_key: create_data}]
          notebook_task:
            notebook_path: ../notebooks/03_entitlements.py
        - task_key: claim_views
          depends_on: [{task_key: entitlements}]
          notebook_task:
            notebook_path: ../notebooks/04_claim_views.py
        - task_key: runtime_grants
          depends_on: [{task_key: claim_views}]
          notebook_task:
            notebook_path: ../notebooks/05_runtime_grants.py
