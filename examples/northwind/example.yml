name: northwind
title: Northwind Retirement Services
claim_prefix: pu-
schemas:
  base: northwind_base
  governance: northwind_governance
  portal: northwind_portal
sql:
  schemas: sql/01_schemas.sql
  base_tables: sql/02_base_tables.sql
  governance: sql/03_governance.sql
  seed_entitlements: sql/04_seed_entitlements.sql
  derived_tables: sql/05_derived_tables.sql
  policy_views: sql/10_policy_views.sql
  portal_views: sql/11_portal_views.sql
  public_views: sql/12_public_views.sql
  policy_functions: sql/30_policy_functions.sql
  runtime_grants: sql/20_runtime_grants.sql
# Created from a claim-carrying session when the workspace raises without a claim. Order matters.
claim_views:
  - governance.my_effective_grants
  - portal.my_access
  - portal.my_accounts
  - portal.my_contributions
  - portal.plan_summary
  - portal.plan_roster
public_views:
  - portal.fund_lineup
grant_roles: [participant, sponsor, advisor]
scope_types: [participant, plan]
role_policy_fields:
  can_view_own_accounts: boolean
  can_view_plan_aggregates: boolean
  can_view_roster: boolean
  mask_dob: boolean
base_probe_table: account_balances
# Layered enforcement: every base table a portal view reads, with the ABAC row policy that protects it.
# A table's policy admits exactly the rows some portal view exposes from it, for the signed-in user. Governance
# tables are the policies' inputs and carry no policy: Unity Catalog doesn't let a policy function read a table
# that has its own policy.
row_policies:
  - {table: base.account_balances, grain: accounts, function: rf_accounts, columns: [[participant_id, member]]}
  - {table: base.contributions, grain: contributions, function: rf_contributions, columns: [[participant_id, member]]}
  - {table: base.participants, grain: roster, function: rf_roster, columns: [[plan_id, tenant]]}
  - {table: base.plans, grain: tenant, function: rf_plans, columns: [[plan_id, tenant]]}
  - {table: base.plan_fund_balances, grain: plan_totals, function: rf_plan_totals, columns: [[plan_id, tenant]]}
  - {table: base.participant_plan_balances, grain: roster_totals, function: rf_roster_totals, columns: [[plan_id, tenant]]}
  - {table: base.funds, grain: reference}
# Column masks in the policy layer: a role that may see a value only masked never reaches it unmasked.
column_masks:
  - {table: base.participants, grain: roster, function: cm_date_of_birth, column: [date_of_birth, birth_date], using: [[plan_id, tenant]]}
# Row-filter and mask functions, created from a claim-carrying session when the workspace raises without a claim. Order matters.
claim_functions: [rf_accounts, rf_contributions, rf_roster, rf_plans, rf_plan_totals, rf_roster_totals, cm_date_of_birth, rf_deny]
# Misconfiguration drills: which persona, protected table, key column and portal view they exercise. The mask drill
# checks a masked column through an unfiltered view, as a persona whose role masks it.
drills: {persona: maya, table: base.account_balances, key_column: participant_id, view: my_accounts,
         mask: {persona: raj, table: base.participants, view: plan_roster, raw_where: "date_of_birth IS NOT NULL"}}
