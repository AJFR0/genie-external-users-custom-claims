name: larkspur
title: Larkspur Pharmacy Benefits
claim_prefix: rx-
schemas:
  base: larkspur_base
  governance: larkspur_governance
  portal: larkspur_portal
sql:
  schemas: sql/01_schemas.sql
  base_tables: sql/02_base_tables.sql
  governance: sql/03_governance.sql
  seed_entitlements: sql/04_seed_entitlements.sql
  derived_tables: sql/05_derived_tables.sql
  policy_views: sql/10_policy_views.sql
  portal_views: sql/11_portal_views.sql
  public_views: sql/12_public_views.sql
  policy_functions: sql/30_policy_functions.sql
  runtime_grants: sql/20_runtime_grants.sql
# Created from a claim-carrying session when the workspace raises without a claim. Order matters.
claim_views:
  - governance.my_effective_grants
  - governance.policy_members
  - governance.my_members
  - portal.my_access
  - portal.my_claims
  - portal.my_accumulators
  - portal.sponsor_spend_summary
  - portal.pharmacy_remittance
public_views:
  - portal.drug_reference
grant_roles: [subscriber, member, sponsor_admin, consultant, pharmacy]
scope_types: [member, sponsor, pharmacy]
role_policy_fields:
  include_minor_dependents: boolean
  mask_identity: boolean
  min_cell_size: int
base_probe_table: pharmacy_claims
# Layered enforcement: every base table a portal view reads, with the ABAC row policy that protects it.
# A table's policy admits exactly the rows some portal view exposes from it, for the signed-in user. Governance
# tables are the policies' inputs and carry no policy: Unity Catalog doesn't let a policy function read a table
# that has its own policy.
row_policies:
  - {table: base.members, grain: members, function: rf_members, columns: [[member_id, member]]}
  - {table: base.pharmacy_claims, grain: claims, function: rf_claims, columns: [[member_id, member]]}
  - {table: base.pharmacy_remittance_rows, grain: remittance, function: rf_remittance, columns: [[pharmacy_id, pharmacy]]}
  - {table: base.accumulators, grain: accumulators, function: rf_accumulators, columns: [[member_id, member]]}
  - {table: base.sponsors, grain: tenant, function: rf_sponsors, columns: [[sponsor_id, tenant]]}
  - {table: base.sponsor_spend_cells, grain: cells, function: rf_cells, columns: [[sponsor_id, tenant], [members, cell_count]]}
  - {table: base.drugs, grain: reference}
  - {table: base.pharmacies, grain: reference}
# No column masks here: a row filter can't take a masked column as an argument, so pharmacy staff read precomputed
# remittance rows that hold only a one-way member reference, and never reach pharmacy_claims at all.
# Row-filter and mask functions, created from a claim-carrying session when the workspace raises without a claim. Order matters.
claim_functions: [rf_members, rf_claims, rf_accumulators, rf_sponsors, rf_cells, rf_remittance, rf_deny]
# Misconfiguration drills: which persona, protected table, key column and portal view they exercise.
drills: {persona: ana, table: base.pharmacy_claims, key_column: member_id, view: my_claims,
         mask: {persona: priya, table: base.pharmacy_claims, view: pharmacy_remittance, raw_where: "member_id LIKE 'M-%'"}}
